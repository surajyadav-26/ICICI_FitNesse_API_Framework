name: FitNesse API Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run (e.g., FrontPage.DummyAPI, FrontPage.Sanity, FrontPage.Smoke)'
        required: false
        default: 'FrontPage.DummyAPI'
      environment:
        description: 'Test environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - uat
        default: 'dev'

# Required permissions for actions
permissions:
  contents: read
  actions: read
  checks: write

env:
  PYTHON_VERSION: '3.10'

jobs:
  api-tests:
    name: Run FitNesse API Tests
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Configure Git for Windows
        shell: powershell
        run: |
          git config --global core.autocrlf true
          git config --global core.longpaths true
          Write-Host "Git configured for Windows"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Test Environment
        shell: powershell
        run: |
          # Set environment variables based on selected environment
          $env:TEST_ENV = "${{ github.event.inputs.environment || 'dev' }}"
          echo "TEST_ENV=$env:TEST_ENV" >> $env:GITHUB_ENV
          
          # Configure base URLs for different environments
          switch ($env:TEST_ENV) {
            "dev" {
              echo "BASE_URL=https://dev-api.example.com" >> $env:GITHUB_ENV
              echo "MOCK_SERVER_URL=http://localhost:8089" >> $env:GITHUB_ENV
            }
            "staging" {
              echo "BASE_URL=https://staging-api.example.com" >> $env:GITHUB_ENV
            }
            "uat" {
              echo "BASE_URL=https://uat-api.example.com" >> $env:GITHUB_ENV
            }
          }

      - name: Start FitNesse Server (Background)
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          
          # Start FitNesse server in background
          $env:PYTHONPATH = $PWD
          
          Write-Host "=========================================="
          Write-Host "STARTING FITNESSE SERVER"
          Write-Host "=========================================="
          Write-Host "Working Directory: $PWD"
          Write-Host "PYTHONPATH: $env:PYTHONPATH"
          Write-Host ""
          Write-Host "Java Version:"
          try {
            $javaVersion = & java -version 2>&1 | Out-String
            Write-Host $javaVersion
          } catch {
            Write-Host "  Could not get Java version"
          }
          Write-Host ""
          
          # Test running FitNesse directly to see any errors
          Write-Host "Testing FitNesse JAR..."
          try {
            $testOutput = & java -cp ".\fitnesse-standalone.jar" fitnesseMain.FitNesseMain -? 2>&1 | Out-String
            Write-Host "FitNesse help output:"
            Write-Host $testOutput
          } catch {
            Write-Host "Error testing FitNesse: $_"
          }
          Write-Host ""
          
          Write-Host "Starting FitNesse with cmd.exe start (truly independent process)..."
          # GitHub Actions kills child processes when step exits, even with Start-Process
          # Solution: Use cmd.exe /c start /b to create process not in job tree
          # Redirect output to files so process doesn't block
          $fitnesseLogs = Join-Path $PWD "fitnesse_output.log"
          $fitnesseErrors = Join-Path $PWD "fitnesse_errors.log"
          
          # Start FitNesse using cmd.exe start with output redirection
          cmd /c "start /b java -cp fitnesse-standalone.jar fitnesseMain.FitNesseMain -p 8080 -e 0 > fitnesse_output.log 2> fitnesse_errors.log"
          
          Write-Host "FitNesse start command issued"
          Write-Host "Output log: $fitnesseLogs"
          Write-Host "Error log: $fitnesseErrors"
          Write-Host "Waiting 20 seconds for initialization..."
          Start-Sleep -Seconds 20
          
          # Check if Java process is running
          $javaProcess = Get-Process -Name "java" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $javaProcess) {
            Write-Error "No Java process found after start"
            if (Test-Path $fitnesseErrors) {
              Write-Host "Error log content:"
              Get-Content $fitnesseErrors | Write-Host
            }
            exit 1
          }
          
          Write-Host "Java process found: PID $($javaProcess.Id)"
          
          # Wait for FitNesse HTTP response
          $maxRetries = 40
          $retryCount = 0
          $serverReady = $false
          
          do {
            Start-Sleep -Seconds 3
            $retryCount++
            
            # Check if Java process is still running
            $currentJavaProcess = Get-Process -Name "java" -ErrorAction SilentlyContinue
            if (-not $currentJavaProcess) {
              Write-Error "Java process terminated during startup"
              if (Test-Path $fitnesseErrors) {
                Write-Host "Error log content:"
                Get-Content $fitnesseErrors | Write-Host
              }
              exit 1
            }
            
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/FrontPage" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200 -and $response.Content.Length -gt 1000) {
                Write-Host "FitNesse server is ready! (Attempt $retryCount, Content: $($response.Content.Length) bytes)"
                $serverReady = $true
                # Wait extra 10 seconds for full initialization
                Write-Host "Waiting 10 seconds for complete initialization..."
                Start-Sleep -Seconds 10
                break
              } else {
                if ($retryCount % 5 -eq 0) {
                  Write-Host "Got response but insufficient content: $($response.Content.Length) bytes"
                }
              }
            } catch {
              if ($retryCount % 5 -eq 0) {
                Write-Host "Waiting for FitNesse... ($retryCount/$maxRetries) - Error: $($_.Exception.Message)"
              }
            }
          } while ($retryCount -lt $maxRetries)
          
          if (-not $serverReady) {
            $finalJavaProcess = Get-Process -Name "java" -ErrorAction SilentlyContinue
            Write-Error "FitNesse server failed to start after $maxRetries attempts ($($maxRetries * 3) seconds)"
            if ($finalJavaProcess) {
              Write-Host "Java process still running but not responding: PID $($finalJavaProcess.Id)"
            } else {
              Write-Host "Java process terminated"
            }
            if (Test-Path $fitnesseErrors) {
              Write-Host "Error log content:"
              Get-Content $fitnesseErrors | Write-Host
            }
            exit 1
          }
          
          Write-Host "SUCCESS: FitNesse server is running and ready for tests"
          $successJavaProcess = Get-Process -Name "java" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($successJavaProcess) {
            Write-Host "Java Process PID: $($successJavaProcess.Id)"
          }
          
          # Clear any accumulated errors and exit successfully
          # FitNesse started via cmd.exe is NOT a child process - survives step exit
          $Error.Clear()
          exit 0

      - name: Verify FitNesse Server
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          
          Write-Host "Verifying FitNesse server connectivity..."
          
          $connected = $false
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8080/FrontPage" -UseBasicParsing -TimeoutSec 5
            Write-Host "Server response status: $($response.StatusCode)"
            Write-Host "Response content length: $($response.Content.Length) bytes"
            Write-Host "Server is accessible and ready for tests"
            $connected = $true
          } catch {
            Write-Host "Failed to connect to FitNesse server: $_"
            $connected = $false
          }
          
          if (-not $connected) {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "CHECKING FITNESSE PROCESS STATUS"
            Write-Host "=========================================="
            Write-Host ""
            
            # Check if Java processes are running
            Write-Host "=== JAVA PROCESSES ==="
            $javaProcesses = Get-Process -Name "java" -ErrorAction SilentlyContinue
            if ($javaProcesses) {
              $javaProcesses | ForEach-Object {
                Write-Host "PID: $($_.Id), Started: $($_.StartTime), CPU: $($_.CPU)s, Memory: $([math]::Round($_.WorkingSet64/1MB, 2))MB"
              }
            } else {
              Write-Host "NO JAVA PROCESSES RUNNING - FitNesse has exited or never started!"
            }
            Write-Host ""
            
            # Check port 8080
            Write-Host "=== PORT 8080 STATUS ==="
            try {
              $tcpConnection = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue
              if ($tcpConnection) {
                Write-Host "Port 8080 is in use by process: $($tcpConnection.OwningProcess)"
              } else {
                Write-Host "Port 8080 is NOT in use - FitNesse not listening"
              }
            } catch {
              Write-Host "Could not check port status: $_"
            }
            Write-Host ""
            
            # Check if fitnesse jar exists
            Write-Host "=== FITNESSE JAR STATUS ==="
            if (Test-Path "fitnesse-standalone.jar") {
              $jar = Get-Item "fitnesse-standalone.jar"
              Write-Host "fitnesse-standalone.jar exists ($($jar.Length) bytes)"
            } else {
              Write-Host "fitnesse-standalone.jar NOT FOUND!"
            }
            Write-Host ""
            
            Write-Host "=== JAVA VERSION ==="
            java -version 2>&1 | Out-String | Write-Host
            Write-Host ""
            
            Write-Error "FitNesse server verification failed - see diagnostics above"
            exit 1
          }
          
          # Verification successful - clear errors and exit
          $Error.Clear()
          exit 0

      - name: Run FitNesse Test Suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          
          # Use actual test suite
          $testSuite = "${{ github.event.inputs.test_suite || 'FrontPage.DummyAPI' }}"
          
          # Try simple format - FitNesse might need Accept header for JSON
          $testUrl = "http://localhost:8080/${testSuite}?suite&format=json"
          
          Write-Host "Running test suite: $testSuite"
          Write-Host "Test URL: $testUrl"
          Write-Host ""
          
          # Wait a bit more to ensure FitNesse is fully ready
          Write-Host "Waiting 5 seconds for FitNesse to be fully ready..."
          Start-Sleep -Seconds 5
          
          $exitCode = 0
          try {
            Write-Host "Sending request to FitNesse with Accept: application/json header..."
            
            # Try with Accept header for JSON
            $headers = @{
              'Accept' = 'application/json'
            }
            $response = Invoke-WebRequest -Uri $testUrl -Headers $headers -UseBasicParsing -TimeoutSec 600
            
            Write-Host "Response received:"
            Write-Host "  Status Code: $($response.StatusCode)"
            Write-Host "  Content-Type: $($response.Headers['Content-Type'])"
            Write-Host "  Content Length: $($response.Content.Length) bytes"
            Write-Host ""
            
            # Check if response is JSON
            $contentType = $response.Headers['Content-Type']
            if ($contentType -notmatch 'application/json') {
              Write-Host "WARNING: Response is not JSON! Content-Type: $contentType"
              Write-Host "FitNesse returned HTML - will attempt to parse test results from HTML"
              Write-Host ""
              
              # If it's HTML, try to parse test results from it
              if ($contentType -match 'text/html') {
                Write-Host "Attempting to extract test results from HTML response..."
                $html = $response.Content
                
                # Save HTML for inspection
                $html | Out-File -FilePath "fitnesse_response.html"
                
                # Try to find test counts in HTML (FitNesse typically shows: X right, Y wrong, Z ignored, W exceptions)
                # Look for patterns like "class='pass'>5</span>" or similar
                $right = 0
                $wrong = 0
                $exceptions = 0
                $ignores = 0
                
                # Try to match FitNesse result format
                if ($html -match 'class=["\']?pass["\']?>\s*(\d+)') { $right = [int]$Matches[1] }
                if ($html -match 'class=["\']?fail["\']?>\s*(\d+)') { $wrong = [int]$Matches[1] }
                if ($html -match 'class=["\']?error["\']?>\s*(\d+)') { $exceptions = [int]$Matches[1] }
                if ($html -match 'class=["\']?ignore["\']?>\s*(\d+)') { $ignores = [int]$Matches[1] }
                
                # Alternative: look for text like "5 right, 0 wrong, 0 ignored, 0 exceptions"
                if ($right -eq 0 -and $html -match '(\d+)\s+right') { $right = [int]$Matches[1] }
                if ($wrong -eq 0 -and $html -match '(\d+)\s+wrong') { $wrong = [int]$Matches[1] }
                if ($exceptions -eq 0 -and $html -match '(\d+)\s+exceptions?') { $exceptions = [int]$Matches[1] }
                if ($ignores -eq 0 -and $html -match '(\d+)\s+ignored?') { $ignores = [int]$Matches[1] }
                
                Write-Host ""
                Write-Host "Test Results Summary (parsed from HTML):"
                Write-Host "Passed: $right"
                Write-Host "Failed: $wrong"
                Write-Host "Exceptions: $exceptions"
                Write-Host "Ignored: $ignores"
                Write-Host ""
                
                # Create JSON structure for consistency
                $testResults = @{
                  finalCounts = @{
                    right = $right
                    wrong = $wrong
                    exceptions = $exceptions
                    ignores = $ignores
                  }
                  executionLog = "Parsed from HTML response (JSON not supported)"
                }
                
                # Save results to file for artifact
                $testResults | ConvertTo-Json -Depth 10 | Out-File -FilePath "test_results.json"
                
                # Fail if there are failures or exceptions
                if ($wrong -gt 0 -or $exceptions -gt 0) {
                  Write-Error "Tests failed! Failures: $wrong, Exceptions: $exceptions"
                  $exitCode = 1
                } else {
                  Write-Host "All tests passed!"
                }
                
                # Skip the JSON parsing section
                $jsonParsed = $true
              } else {
                Write-Error "Unexpected content type: $contentType"
                exit 1
              }
            } else {
              $jsonParsed = $false
            }
            
            # Only parse JSON if we got JSON response
            if (-not $jsonParsed) {
              Write-Host "Parsing JSON response..."
              $testResults = $response.Content | ConvertFrom-Json
            
              # Extract results
              $right = $testResults.finalCounts.right
              $wrong = $testResults.finalCounts.wrong
              $exceptions = $testResults.finalCounts.exceptions
              $ignores = $testResults.finalCounts.ignores
              
              Write-Host ""
              Write-Host "Test Results Summary:"
              Write-Host "Passed: $right"
              Write-Host "Failed: $wrong"
              Write-Host "Exceptions: $exceptions"
              Write-Host "Ignored: $ignores"
              Write-Host ""
              
              # Save results to file for artifact
              $testResults | ConvertTo-Json -Depth 10 | Out-File -FilePath "test_results.json"
              
              # Fail the build if there are failures or exceptions
              if ($wrong -gt 0 -or $exceptions -gt 0) {
                Write-Error "Tests failed! Failures: $wrong, Exceptions: $exceptions"
                $exitCode = 1
              } else {
                Write-Host "All tests passed!"
              }
            }
          } catch {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "ERROR RUNNING TESTS"
            Write-Host "=========================================="
            Write-Host "Error: $_"
            Write-Host "Error Type: $($_.Exception.GetType().FullName)"
            Write-Host ""
            
            # Check if FitNesse is still running
            $javaProcess = Get-Process -Name "java" -ErrorAction SilentlyContinue
            if ($javaProcess) {
              Write-Host "FitNesse process is still running (PID: $($javaProcess.Id))"
            } else {
              Write-Host "FitNesse process has died!"
            }
            
            # Try to access FitNesse home page
            try {
              $homeCheck = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing -TimeoutSec 5
              Write-Host "FitNesse home page accessible (Status: $($homeCheck.StatusCode))"
            } catch {
              Write-Host "Cannot access FitNesse home page: $_"
            }
            
            Write-Error "Failed to run tests: $_"
            $exitCode = 1
          }
          
          # Clear errors if tests passed
          if ($exitCode -eq 0) {
            $Error.Clear()
          }
          
          exit $exitCode

      - name: Copy Test Results
        if: always()
        shell: powershell
        run: |
          # Create artifacts directory
          New-Item -ItemType Directory -Force -Path test-artifacts
          
          # Copy test results
          if (Test-Path "FitNesseRoot\files\testResults") {
            Copy-Item -Path "FitNesseRoot\files\testResults\*" -Destination test-artifacts -Recurse -Force
          }
          
          # Copy HTML report if exists
          if (Test-Path "FitNesseRoot\files\report.html") {
            Copy-Item -Path "FitNesseRoot\files\report.html" -Destination test-artifacts -Force
          }
          
          # Copy logs
          if (Test-Path "logs") {
            Copy-Item -Path "logs\*" -Destination test-artifacts -Recurse -Force
          }
          
          # Copy FitNesse logs
          if (Test-Path "fitnesse_output.log") {
            Copy-Item -Path "fitnesse_output.log" -Destination test-artifacts -Force
          }
          if (Test-Path "fitnesse_error.log") {
            Copy-Item -Path "fitnesse_error.log" -Destination test-artifacts -Force
          }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: test-artifacts/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ github.run_number }}
          path: FitNesseRoot/files/report.html
          retention-days: 30
          if-no-files-found: ignore
          compression-level: 6

      - name: Generate Test Summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path "test_results.json") {
            $results = Get-Content "test_results.json" | ConvertFrom-Json
            $right = $results.finalCounts.right
            $wrong = $results.finalCounts.wrong
            $exceptions = $results.finalCounts.exceptions
            
            $summary = @"
          ## FitNesse API Test Results
          
          **Environment:** ${{ github.event.inputs.environment || 'dev' }}
          **Test Suite:** ${{ github.event.inputs.test_suite || 'FrontPage' }}
          
          | Metric | Count |
          |--------|-------|
          | Passed | $right |
          | Failed | $wrong |
          | Exceptions | $exceptions |
          | Ignored | $($results.finalCounts.ignores) |
          
          **Status:** $(if ($wrong -eq 0 -and $exceptions -eq 0) { 'SUCCESS' } else { 'FAILED' })
          "@
            
            $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Notify on Failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "Test execution failed!"
          Write-Host "Check the artifacts for detailed results"
          Write-Host "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Optional: Deploy reports to GitHub Pages
  deploy-reports:
    name: Deploy Test Reports to GitHub Pages
    needs: api-tests
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Download HTML Report
        uses: actions/download-artifact@v4
        with:
          name: html-report-${{ github.run_number }}
          path: ./reports

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports/${{ github.run_number }}
